<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheIceDragonz | Official Hub</title>
    
    <!-- SEO & Metadata -->
    <meta name="description" content="Official website of TheIceDragonz - VRChat 3D avatars, Discord community and digital assets.">
    <meta name="keywords" content="TheIceDragonz, VRChat Avatars, 3D Assets, Gumroad, Payhip, Discord Community">
    <meta name="author" content="TheIceDragonz">
    <meta name="theme-color" content="#06080e">
    <link rel="icon" type="image/png" href="Ice.png">

    <!-- Open Graph / Social Cards -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="TheIceDragonz">
    <meta property="og:description" content="Explore official VRChat 3D avatars, store links, ToS, and Discord community.">
    <meta property="og:image" content="Ice.png">
    <meta property="og:url" content="https://theicedragonz.github.io/">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom Style System -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="wrapper">
        
        <!-- Brand Profile & Hero Header -->
        <header class="brand-header">
            <div class="logo-container">
                <a href="./">
                    <img src="Ice.png" onerror="this.onerror=null; this.src='https://raw.githubusercontent.com/TheIceDragonz/theicedragonz.github.io/main/Ice.png'" alt="TheIceDragonz Logo" class="brand-logo">
                </a>
            </div>
            
            <h1 class="brand-title">TheIceDragonz</h1>
        </header>

        <!-- Multi-page Navigation Bar -->
        <nav class="nav-tabs-container" aria-label="Main Navigation">
            <div class="nav-tabs">
                <a href="./" class="nav-tab-btn active" style="text-decoration: none;">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="boosters/" class="nav-tab-btn" style="text-decoration: none;">
                    <i class="fa-solid fa-gem"></i> Nitro Boosters
                </a>
                <a href="tos/" class="nav-tab-btn" style="text-decoration: none;">
                    <i class="fa-solid fa-scale-balanced"></i> Terms of Service
                </a>
            </div>
        </nav>

        <!-- ================================================================
             HOME PERSONAL PAGE (Link e Hub)
             ================================================================ -->
        <main class="content-section active">
            <div class="glass-card" style="text-align: center; padding: 40px 24px;">
                
                <!-- Official Stores & Community Links Grid -->
                <div style="display: flex; flex-direction: column; gap: 14px; max-width: 480px; margin: 0 auto 28px auto;">
                    <a href="https://theicedragonz.gumroad.com/" class="btn-main btn-gumroad" target="_blank" rel="noopener noreferrer" style="justify-content: center; padding: 15px 24px; font-size: 1rem; border-radius: var(--radius-md);">
                        <i class="fa-solid fa-bag-shopping" style="font-size: 1.15rem;"></i> Gumroad Store
                    </a>
                    
                    <a href="https://payhip.com/TheIceDragonz" class="btn-main btn-payhip" target="_blank" rel="noopener noreferrer" style="justify-content: center; padding: 15px 24px; font-size: 1rem; border-radius: var(--radius-md);">
                        <i class="fa-solid fa-cart-shopping" style="font-size: 1.15rem;"></i> Payhip Store
                    </a>
                    
                    <a href="https://discord.com/invite/yf8vG5Ddcb" class="btn-main btn-discord" target="_blank" rel="noopener noreferrer" style="justify-content: center; padding: 15px 24px; font-size: 1rem; border-radius: var(--radius-md);">
                        <i class="fa-brands fa-discord" style="font-size: 1.15rem;"></i> Discord Community
                    </a>
                </div>

                <!-- Fast Nav Hub Cards -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; max-width: 600px; margin: 0 auto; text-align: left;">
                    
                    <a href="boosters/" style="text-decoration: none; color: inherit; display: block;">
                        <div class="tos-clause" style="margin-bottom: 0; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="clause-icon" style="background: rgba(244, 63, 94, 0.15); color: #f472b6; border: 1px solid rgba(244, 63, 94, 0.3); width: 36px; height: 36px; font-size: 0.95rem;">
                                    <i class="fa-solid fa-gem"></i>
                                </div>
                                <div>
                                    <h4 style="font-size: 0.98rem; font-weight: 700; color: #fff;">Nitro Boosters</h4>
                                    <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0;">Community VIP Wall</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color: var(--text-dim); font-size: 0.85rem;"></i>
                        </div>
                    </a>

                    <a href="tos/" style="text-decoration: none; color: inherit; display: block;">
                        <div class="tos-clause" style="margin-bottom: 0; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;">
                            <div style="display: flex; align-items: center; gap: 12px;">
                                <div class="clause-icon blue" style="width: 36px; height: 36px; font-size: 0.95rem;">
                                    <i class="fa-solid fa-scale-balanced"></i>
                                </div>
                                <div>
                                    <h4 style="font-size: 0.98rem; font-weight: 700; color: #fff;">Terms of Service</h4>
                                    <p style="font-size: 0.8rem; color: var(--text-muted); margin: 0;">Rules &amp; License</p>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color: var(--text-dim); font-size: 0.85rem;"></i>
                        </div>
                    </a>

                </div>

            </div>
        </main>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 TheIceDragonz. All rights reserved.</p>
        </footer>

    </div>

    <!-- Floating Particle Catch Counter (Bottom Right) -->
    <div id="particle-counter-widget" class="particle-counter-widget" title="Particles caught!">
        <div class="counter-icon-wrap">
            <img src="CustomCursor/pusheen-the-cat-eating-rice-animated-pointer-32x32.png" alt="Pusheen" class="counter-cat-icon">
        </div>
        <div class="counter-data">
            <span class="counter-number" id="particle-caught-count">0</span>
            <span class="counter-label">Caught</span>
        </div>
    </div>

    <!-- Floating Back to Top Button -->
    <button id="back-to-top" class="back-to-top-btn" title="Back to Top" aria-label="Back to Top">
        <i class="fa-solid fa-chevron-up"></i>
    </button>

    <!-- Toast Notification Container -->
    <div id="toast-container"></div>

    <!-- Application Scripts -->
    <script src="js/particles.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
