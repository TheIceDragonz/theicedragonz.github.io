name: Deploy Site directory to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy Assets into Site for web access
        run: |
          cp -r ./DiscordNitro ./Site/DiscordNitro
          cp -r ./CustomCursor ./Site/CustomCursor
          cp -r ./VRChat ./Site/VRChat

      - name: Fetch latest VRChat World stats
        run: |
          curl -s -H "User-Agent: TheIceDragonzWebsite/1.0 (contact: github.com/TheIceDragonz)" \
            "https://api.vrchat.cloud/api/1/worlds/wrld_3c78d22f-e1d7-471c-a2b4-de208249f473" \
            -o ./Site/VRChat/World.json || echo "Could not fetch VRChat stats, keeping fallback"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './Site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
